# Applied to any profile that lists this bundle (`dsh plugin add`).
#
# upstreamOrigin and listenPort have no default and validation fails loudly
# until you set them, so replace the placeholders below, or override this
# whole row by `id` in your profile's own cordis.patch.yml /
# $DSH_HOME/cordis.patch.yml (a later layer replaces the entire `config`,
# not just the changed key).
- insert:
    - id: vision-3090-fix
      name: dsh-vision-3090-fix
      config:
        upstreamOrigin: http://127.0.0.1:1234
        listenHost: 127.0.0.1
        listenPort: 8931
        maxImagesPerRequest: 1
        models: []
